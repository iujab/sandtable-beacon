# SandtableBeacon - XcodeGen spec. UNCOMPILED SOURCE: see docs/IOS_BUILD.md.
#
#   brew install xcodegen      # once
#   cd apps/ios && xcodegen    # writes SandtableBeacon.xcodeproj (replaces the hand-written one)
#
# Before building: set DEVELOPMENT_TEAM below (or pick your team in Xcode) and make the
# bundle id unique (change com.example.sandtablebeacon to something of your own).

name: SandtableBeacon
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  SandtableBeacon:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SandtableBeacon
    settings:
      base:
        PRODUCT_NAME: SandtableBeacon
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sandtablebeacon
        INFOPLIST_FILE: SandtableBeacon/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: NO
