<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Beacon puck: tonight's table puck and a throwable concept (sketch, not built)</title>
  <rect x="0" y="0" width="960" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03030"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.2"/>
    </pattern>
  </defs>

  <text x="24" y="34" font-size="18" font-weight="bold" fill="#111">Beacon puck, side views (a sketch: nothing here has been built or tested)</text>
  <text x="24" y="56" fill="#555">Rules from docs/research/puck_hardware.md section 6: antenna 15 cm or more above the floor, board upright,</text>
  <text x="24" y="73" fill="#555">no metal or battery near the antenna, an RF-transparent cover, non-component side toward the phone.</text>

  <!-- ===================== A: tonight's table puck ===================== -->
  <text x="40" y="112" font-size="15" font-weight="bold" fill="#111">A. Tonight: the table puck</text>
  <line x1="30" y1="470" x2="455" y2="470" stroke="#333" stroke-width="2"/>
  <rect x="30" y="470" width="425" height="12" fill="url(#hatch)"/>
  <text x="34" y="500" fill="#555">floor</text>
  <!-- battery bank -->
  <rect x="80" y="420" width="120" height="50" rx="6" fill="#d9e4f2" stroke="#2b4f81" stroke-width="1.5"/>
  <text x="140" y="450" text-anchor="middle" fill="#2b4f81">USB bank</text>
  <!-- cup / stand -->
  <path d="M250 470 L262 300 L338 300 L350 470 Z" fill="#f3efe6" stroke="#6b5b3a" stroke-width="1.5"/>
  <text x="300" y="430" text-anchor="middle" fill="#6b5b3a">cup or box</text>
  <text x="300" y="446" text-anchor="middle" fill="#6b5b3a">(the stand)</text>
  <!-- board upright on the cup -->
  <rect x="292" y="196" width="16" height="104" fill="#2f7d3a" stroke="#1b4d22" stroke-width="1"/>
  <rect x="294" y="200" width="12" height="22" fill="#c9a227"/>
  <text x="316" y="214" fill="#111">antenna end up</text>
  <text x="316" y="252" fill="#111">DWM3001CDK,</text>
  <text x="316" y="268" fill="#111">upright</text>
  <!-- cable -->
  <path d="M200 440 C 240 430, 280 330, 298 300" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="40" y="360" fill="#333">micro-USB data cable:</text>
  <text x="40" y="376" fill="#333">J20 first; J9 if the</text>
  <text x="40" y="392" fill="#333">bank switches itself off</text>
  <!-- height dimension -->
  <line x1="430" y1="468" x2="430" y2="200" stroke="#b03030" stroke-width="1.5" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="422" y="400" fill="#b03030" text-anchor="middle" transform="rotate(-90 422 400)">15 cm or more</text>
  <!-- phone direction -->
  <line x1="286" y1="160" x2="60" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="60" y="150" fill="#333">non-component side faces the phone</text>

  <!-- ===================== B: throwable concept ===================== -->
  <text x="500" y="112" font-size="15" font-weight="bold" fill="#111">B. A throwable puck (concept, not built)</text>
  <line x1="490" y1="470" x2="940" y2="470" stroke="#333" stroke-width="2"/>
  <rect x="490" y="470" width="450" height="12" fill="url(#hatch)"/>
  <!-- weighted self-righting base -->
  <path d="M600 470 Q 600 380 700 380 Q 800 380 800 470 Z" fill="#e8e8e8" stroke="#444" stroke-width="1.5"/>
  <rect x="655" y="430" width="90" height="30" rx="4" fill="#d9e4f2" stroke="#2b4f81" stroke-width="1.5"/>
  <text x="700" y="450" text-anchor="middle" fill="#2b4f81" font-size="12">battery = ballast</text>
  <text x="810" y="420" fill="#444">heavy, rounded</text>
  <text x="810" y="436" fill="#444">base: rights itself</text>
  <text x="810" y="452" fill="#444">after a throw</text>
  <!-- mast -->
  <rect x="692" y="214" width="16" height="166" fill="#cfcfcf" stroke="#444" stroke-width="1"/>
  <text x="716" y="300" fill="#444">short plastic mast,</text>
  <text x="716" y="316" fill="#444">cable inside</text>
  <!-- radome -->
  <rect x="664" y="128" width="72" height="88" rx="28" fill="#fff7e0" stroke="#c98a00" stroke-width="2"/>
  <rect x="692" y="138" width="16" height="70" fill="#2f7d3a" stroke="#1b4d22" stroke-width="1"/>
  <rect x="694" y="142" width="12" height="16" fill="#c9a227"/>
  <text x="746" y="146" fill="#c98a00">RF-transparent radome:</text>
  <text x="746" y="162" fill="#c98a00">no metal, antenna at least</text>
  <text x="746" y="178" fill="#c98a00">3 mm (ideally 5 mm) from metal</text>
  <text x="746" y="206" fill="#111">board upright inside</text>
  <!-- height dimension -->
  <line x1="570" y1="468" x2="570" y2="142" stroke="#b03030" stroke-width="1.5" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="562" y="305" fill="#b03030" text-anchor="middle" transform="rotate(-90 562 305)">antenna 15 cm or more up</text>
  <!-- note -->
  <text x="500" y="520" fill="#555">Also needed for real use: heat, water and shock protection, a drop rating,</text>
  <text x="500" y="538" fill="#555">regulatory approval, and a radio with angle of arrival (hardware/PUCK.md).</text>
</svg>
