[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwbkit"
version = "1.0.0"
description = "Shared UWB ranging kit: hub, simulator, solver, clients and bring-up tools (HackPrinceton Fall 2026 bench)"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.10",
  "numpy>=2.1",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "matplotlib>=3.9"]

[project.scripts]
uwbkit = "uwbkit.cli:main"

[tool.setuptools.packages.find]
include = ["uwbkit*"]

[tool.setuptools.package-data]
uwbkit = ["static/*", "static/**/*", "sim/scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
